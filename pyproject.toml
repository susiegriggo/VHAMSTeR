[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vhamster"
version = "1.0.1"
description = "vHAMSTeR ensemble inference CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.3,<9",
  "loguru>=0.7,<1",
  "numpy>=2.4,<3",
  "polars>=1.39,<2",
  "torch>=2.11,<3",
  "tqdm>=4.67,<5",
  "transformers>=5.4,<6",
  "peft>=0.18,<1",
  "biopython>=1.87,<2",
  "pyrodigal-gv>=0.3.2,<0.4",
  "scikit-learn>=1.8,<2",
  "requests>=2.33,<3",
]

[project.scripts]
vhamster = "vhamster:main"
vhamster-install-models = "install_models:main"

[tool.setuptools]
py-modules = ["vhamster", "install_models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]
